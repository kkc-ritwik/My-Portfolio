<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="HRMS SaaS Platform microservices architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="220" cy="140" r="260" fill="url(#glow)"/>
  <circle cx="1080" cy="600" r="300" fill="url(#glow)"/>

  <!-- Title -->
  <text x="64" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">HRMS SaaS Platform</text>
  <text x="64" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#a5b4fc">Java 17 · Spring Boot · 32+ Microservices · Multi-Tenant · React</text>
  <rect x="64" y="150" width="180" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- API Gateway -->
  <g>
    <rect x="470" y="196" width="340" height="64" rx="14" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="506" cy="228" r="9" fill="#38bdf8"/>
    <text x="530" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">API Gateway · Eureka Discovery</text>
  </g>

  <!-- connector lines -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.5">
    <line x1="640" y1="260" x2="200" y2="330"/>
    <line x1="640" y1="260" x2="430" y2="330"/>
    <line x1="640" y1="260" x2="640" y2="330"/>
    <line x1="640" y1="260" x2="850" y2="330"/>
    <line x1="640" y1="260" x2="1080" y2="330"/>
  </g>

  <!-- Service cards row 1 -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="90" y="330" width="220" height="92" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="110" y="368" font-size="21" font-weight="600" fill="#c7d2fe">People</text>
      <text x="110" y="396" font-size="15" fill="#94a3b8">Employees · Org · Roles</text>
    </g>
    <g>
      <rect x="330" y="330" width="220" height="92" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="350" y="368" font-size="21" font-weight="600" fill="#c7d2fe">Payroll</text>
      <text x="350" y="396" font-size="15" fill="#94a3b8">PF · ESI · TDS</text>
    </g>
    <g>
      <rect x="570" y="330" width="220" height="92" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="590" y="368" font-size="21" font-weight="600" fill="#c7d2fe">Recruit</text>
      <text x="590" y="396" font-size="15" fill="#94a3b8">Hiring · Onboarding</text>
    </g>
    <g>
      <rect x="810" y="330" width="220" height="92" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="830" y="368" font-size="21" font-weight="600" fill="#c7d2fe">Connect</text>
      <text x="830" y="396" font-size="15" fill="#94a3b8">Leave · Attendance</text>
    </g>
    <g>
      <rect x="1050" y="330" width="140" height="92" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="1070" y="368" font-size="21" font-weight="600" fill="#c7d2fe">LMS</text>
      <text x="1070" y="396" font-size="15" fill="#94a3b8">+ 27 more</text>
    </g>
  </g>

  <!-- Infra strip -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="90" y="470" width="1100" height="150" rx="18" fill="#0b1022" stroke="#312e81" stroke-width="1.5"/>
    <text x="116" y="508" font-size="18" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">DATA &amp; INFRASTRUCTURE LAYER</text>

    <g transform="translate(116,532)">
      <g>
        <rect width="150" height="64" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="75" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#e0f2fe">PostgreSQL 16</text>
      </g>
      <g transform="translate(170,0)">
        <rect width="120" height="64" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="60" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#e0f2fe">Redis</text>
      </g>
      <g transform="translate(310,0)">
        <rect width="120" height="64" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="60" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#e0f2fe">Kafka</text>
      </g>
      <g transform="translate(450,0)">
        <rect width="160" height="64" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="80" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#e0f2fe">Elasticsearch</text>
      </g>
      <g transform="translate(630,0)">
        <rect width="120" height="64" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="60" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#e0f2fe">MinIO</text>
      </g>
      <g transform="translate(770,0)">
        <rect width="130" height="64" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="65" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#e0f2fe">Docker</text>
      </g>
      <g transform="translate(920,0)">
        <rect width="150" height="64" rx="12" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="75" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#e0f2fe">Kubernetes</text>
      </g>
    </g>
  </g>

  <!-- footer tag -->
  <text x="64" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">Schema-per-tenant multi-tenancy · 150+ JPA entities · 200+ REST endpoints</text>
</svg>
