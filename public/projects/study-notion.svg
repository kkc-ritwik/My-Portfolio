<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Study-Notion ed-tech platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/><stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.5"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="150" cy="100" r="190" fill="url(#glow)"/>
  <circle cx="690" cy="370" r="190" fill="url(#glow)"/>
  <text x="48" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Study-Notion</text>
  <text x="48" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5eead4">MERN-stack ed-tech learning platform</text>
  <rect x="48" y="132" width="120" height="4" rx="2" fill="#2dd4bf"/>
  <!-- course cards -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(48,170)">
      <rect width="220" height="130" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#14b8a6" stroke-opacity="0.4"/>
      <rect x="16" y="16" width="188" height="60" rx="8" fill="#14b8a6" fill-opacity="0.18"/>
      <text x="16" y="48" font-size="22" fill="#5eead4">▶</text>
      <rect x="16" y="88" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="16" y="106" width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
    </g>
    <g transform="translate(284,170)">
      <rect width="220" height="130" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#14b8a6" stroke-opacity="0.4"/>
      <rect x="16" y="16" width="188" height="60" rx="8" fill="#14b8a6" fill-opacity="0.18"/>
      <text x="16" y="48" font-size="22" fill="#5eead4">▶</text>
      <rect x="16" y="88" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="16" y="106" width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
    </g>
    <!-- stats -->
    <g transform="translate(520,170)">
      <rect width="232" height="130" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#14b8a6" stroke-opacity="0.4"/>
      <text x="20" y="44" font-size="30" font-weight="800" fill="#ffffff">2000+</text>
      <text x="20" y="66" font-size="13" fill="#5eead4">active learners</text>
      <text x="20" y="100" font-size="22" font-weight="800" fill="#ffffff">99.9%</text>
      <text x="20" y="120" font-size="13" fill="#5eead4">availability</text>
    </g>
  </g>
  <!-- tech chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(48,330)"><rect width="120" height="42" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="60" y="28" text-anchor="middle" fill="#ccfbf1">React</text></g>
    <g transform="translate(182,330)"><rect width="130" height="42" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="65" y="28" text-anchor="middle" fill="#ccfbf1">Node.js</text></g>
    <g transform="translate(326,330)"><rect width="150" height="42" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="75" y="28" text-anchor="middle" fill="#ccfbf1">MongoDB</text></g>
    <g transform="translate(490,330)"><rect width="140" height="42" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="70" y="28" text-anchor="middle" fill="#ccfbf1">Express</text></g>
  </g>
</svg>
