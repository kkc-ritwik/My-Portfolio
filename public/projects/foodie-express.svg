<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Foodie-Express food delivery backend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1207"/><stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.5"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="100" r="200" fill="url(#glow)"/>
  <circle cx="120" cy="380" r="180" fill="url(#glow)"/>
  <text x="48" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Foodie-Express</text>
  <text x="48" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fdba74">High-performance food delivery backend</text>
  <rect x="48" y="132" width="120" height="4" rx="2" fill="#fb923c"/>
  <!-- order flow -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(48,180)">
      <rect width="150" height="70" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.45"/>
      <text x="75" y="34" text-anchor="middle" fill="#ffedd5">Customer</text>
      <text x="75" y="54" text-anchor="middle" font-size="12" fill="#fdba74">places order</text>
    </g>
    <text x="214" y="222" fill="#fb923c" font-size="22">→</text>
    <g transform="translate(240,180)">
      <rect width="150" height="70" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.45"/>
      <text x="75" y="34" text-anchor="middle" fill="#ffedd5">Restaurant</text>
      <text x="75" y="54" text-anchor="middle" font-size="12" fill="#fdba74">accepts</text>
    </g>
    <text x="406" y="222" fill="#fb923c" font-size="22">→</text>
    <g transform="translate(432,180)">
      <rect width="150" height="70" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.5"/>
      <text x="75" y="34" text-anchor="middle" fill="#dcfce7">Delivery</text>
      <text x="75" y="54" text-anchor="middle" font-size="12" fill="#86efac">tracked live</text>
    </g>
    <g transform="translate(624,180)">
      <rect width="128" height="70" rx="14" fill="#f97316" fill-opacity="0.25" stroke="#f97316" stroke-opacity="0.5"/>
      <text x="64" y="34" text-anchor="middle" fill="#ffedd5">65% faster</text>
      <text x="64" y="54" text-anchor="middle" font-size="12" fill="#fdba74">response</text>
    </g>
  </g>
  <!-- tech chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(48,300)"><rect width="150" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="75" y="29" text-anchor="middle" fill="#ffedd5">Spring Boot</text></g>
    <g transform="translate(212,300)"><rect width="110" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="55" y="29" text-anchor="middle" fill="#ffedd5">JWT</text></g>
    <g transform="translate(336,300)"><rect width="120" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="60" y="29" text-anchor="middle" fill="#ffedd5">MySQL</text></g>
    <g transform="translate(470,300)"><rect width="170" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="85" y="29" text-anchor="middle" fill="#ffedd5">REST APIs</text></g>
  </g>
</svg>
