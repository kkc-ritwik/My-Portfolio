<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="HRPulse human resource management backend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="130" cy="100" r="190" fill="url(#glow)"/>
  <circle cx="690" cy="380" r="190" fill="url(#glow)"/>
  <text x="48" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">HRPulse</text>
  <text x="48" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#d8b4fe">All-in-one HR management backend</text>
  <rect x="48" y="132" width="120" height="4" rx="2" fill="#c084fc"/>
  <!-- modules grid -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    <g transform="translate(48,170)"><rect width="170" height="90" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.4"/><text x="85" y="42" text-anchor="middle" fill="#f3e8ff">Payroll</text><text x="85" y="66" text-anchor="middle" font-size="12" font-weight="400" fill="#d8b4fe">tax · allowances</text></g>
    <g transform="translate(234,170)"><rect width="170" height="90" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.4"/><text x="85" y="42" text-anchor="middle" fill="#f3e8ff">Leave</text><text x="85" y="66" text-anchor="middle" font-size="12" font-weight="400" fill="#d8b4fe">approval flows</text></g>
    <g transform="translate(420,170)"><rect width="170" height="90" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#a855f7" stroke-opacity="0.4"/><text x="85" y="42" text-anchor="middle" fill="#f3e8ff">Attendance</text><text x="85" y="66" text-anchor="middle" font-size="12" font-weight="400" fill="#d8b4fe">shifts · time</text></g>
    <g transform="translate(606,170)"><rect width="146" height="90" rx="14" fill="#a855f7" fill-opacity="0.22" stroke="#a855f7" stroke-opacity="0.5"/><text x="73" y="42" text-anchor="middle" fill="#f3e8ff">RBAC</text><text x="73" y="66" text-anchor="middle" font-size="12" font-weight="400" fill="#d8b4fe">JWT secured</text></g>
  </g>
  <!-- tech chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(48,300)"><rect width="150" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="75" y="29" text-anchor="middle" fill="#f3e8ff">Spring Boot</text></g>
    <g transform="translate(212,300)"><rect width="130" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="65" y="29" text-anchor="middle" fill="#f3e8ff">Hibernate</text></g>
    <g transform="translate(356,300)"><rect width="110" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="55" y="29" text-anchor="middle" fill="#f3e8ff">MySQL</text></g>
    <g transform="translate(480,300)"><rect width="100" height="44" rx="12" fill="#ffffff" fill-opacity="0.08"/><text x="50" y="29" text-anchor="middle" fill="#f3e8ff">JWT</text></g>
  </g>
</svg>
