<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="RecruitHub recruitment system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="180" fill="url(#glow)"/>
  <circle cx="700" cy="380" r="200" fill="url(#glow)"/>
  <text x="48" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">RecruitHub</text>
  <text x="48" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#93c5fd">Role-based recruitment &amp; interview management</text>
  <rect x="48" y="132" width="120" height="4" rx="2" fill="#60a5fa"/>
  <!-- pipeline columns -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(48,170)">
      <rect width="160" height="220" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#bfdbfe">Applied</text>
      <rect x="14" y="46" width="132" height="34" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="14" y="90" width="132" height="34" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="14" y="134" width="132" height="34" rx="8" fill="#ffffff" fill-opacity="0.08"/>
    </g>
    <g transform="translate(224,170)">
      <rect width="160" height="220" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#bfdbfe">Interview</text>
      <rect x="14" y="46" width="132" height="34" rx="8" fill="#3b82f6" fill-opacity="0.3"/>
      <rect x="14" y="90" width="132" height="34" rx="8" fill="#ffffff" fill-opacity="0.08"/>
    </g>
    <g transform="translate(400,170)">
      <rect width="160" height="220" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#bfdbfe">Hired</text>
      <rect x="14" y="46" width="132" height="34" rx="8" fill="#22c55e" fill-opacity="0.3"/>
    </g>
    <!-- side panel -->
    <g transform="translate(576,170)">
      <rect width="176" height="220" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="16" y="32" font-size="14" font-weight="700" fill="#93c5fd">6 ROLE-BASED PANELS</text>
      <text x="16" y="70" font-size="13" fill="#cbd5e1">Spring Boot · Thymeleaf</text>
      <text x="16" y="96" font-size="13" fill="#cbd5e1">MySQL · Spring Security</text>
      <text x="16" y="122" font-size="13" fill="#cbd5e1">JWT · Email alerts</text>
      <text x="16" y="148" font-size="13" fill="#cbd5e1">DataTables · JUnit</text>
    </g>
  </g>
</svg>
