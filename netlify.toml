[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback so client-side routing / refreshes serve index.html.
# (Function routes like /api/chat are matched first and are unaffected.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
